<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pulse — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0b0d12; --panel:#11141b; --panel-2:#161a23; --border:#1f2430;
  --fg:#e6e9ef; --muted:#8a93a6; --accent:#10b981; --accent-2:#3b82f6;
  --danger:#ef4444;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{
  height:100%; background:var(--bg); color:var(--fg);
  font-family:'Sora',sans-serif; overflow:hidden;
}

/* ── BACKGROUND GRID ── */
.bg-grid{
  position:fixed; inset:0; z-index:0;
  background-image:
    linear-gradient(rgba(16,185,129,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(16,185,129,0.04) 1px, transparent 1px);
  background-size:48px 48px;
}
.bg-glow{
  position:fixed; top:-200px; left:50%; transform:translateX(-50%);
  width:700px; height:500px; z-index:0;
  background:radial-gradient(ellipse, rgba(16,185,129,0.12) 0%, transparent 70%);
  pointer-events:none;
}

/* ── LAYOUT ── */
.page{
  position:relative; z-index:1;
  min-height:100vh; display:flex; flex-direction:column;
}
header{
  height:56px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 28px; gap:10px;
  flex-shrink:0;
}
.logo-box{
  width:28px; height:28px; border-radius:8px;
  background:var(--accent); display:flex; align-items:center; justify-content:center;
}
.logo-box span{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px; color:#04130c;}
.logo-name{font-weight:600; font-size:15px; letter-spacing:-0.02em;}
.logo-chip{
  font-size:11px; padding:2px 8px; border-radius:6px;
  background:var(--panel-2); border:1px solid var(--border); color:var(--muted);
}

main{
  flex:1; display:flex; align-items:center; justify-content:center;
  padding:32px 20px;
}
.card{
  width:100%; max-width:400px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:36px 32px;
  animation:rise .45s cubic-bezier(.16,1,.3,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

.card-header{margin-bottom:28px;}
.card-header h1{font-size:22px; font-weight:600; letter-spacing:-0.03em; margin-bottom:6px;}
.card-header p{font-size:13px; color:var(--muted); line-height:1.5;}

/* ── FORM ── */
.field{margin-bottom:16px;}
label{display:block; font-size:12px; font-weight:500; color:var(--muted);
  text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px;}
.input-wrap{position:relative;}
input{
  width:100%; background:var(--panel-2);
  border:1px solid var(--border); border-radius:8px;
  padding:10px 14px; font-size:14px; font-family:'Sora',sans-serif;
  color:var(--fg); outline:none; transition:border-color .2s;
}
input:focus{border-color:var(--accent);}
input::placeholder{color:var(--muted);}
.eye{
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  cursor:pointer; color:var(--muted); font-size:15px; user-select:none;
  transition:color .2s;
}
.eye:hover{color:var(--fg);}

.btn{
  width:100%; padding:11px; border:none; border-radius:8px;
  background:var(--accent); color:#04130c;
  font-size:14px; font-weight:600; font-family:'Sora',sans-serif;
  cursor:pointer; transition:all .2s; margin-top:4px;
  letter-spacing:.01em;
}
.btn:hover{background:#0ea572; transform:translateY(-1px);}
.btn:active{transform:none;}

.divider{
  display:flex; align-items:center; gap:12px;
  margin:20px 0; color:var(--muted); font-size:12px;
}
.divider::before,.divider::after{
  content:''; flex:1; height:1px; background:var(--border);
}

.links{
  display:flex; justify-content:space-between;
  font-size:12px; margin-top:20px;
}
.links a{color:var(--accent); text-decoration:none; transition:opacity .2s;}
.links a:hover{opacity:.75;}

.error{
  display:none; background:rgba(239,68,68,0.1);
  border:1px solid rgba(239,68,68,0.3);
  border-radius:8px; padding:10px 14px;
  font-size:13px; color:var(--danger); margin-bottom:16px;
}
.error.show{display:block; animation:rise .3s ease both;}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>

<div class="page">
  <header>
    <div class="logo-box"><span>P</span></div>
    <span class="logo-name">Pulse</span>
    <span class="logo-chip">Marketing</span>
  </header>

  <main>
    <div class="card">
      <div class="card-header">
        <h1>Welcome back</h1>
        <p>Sign in to your Pulse dashboard</p>
      </div>

      <div id="err" class="error">Invalid email or password. Please try again.</div>

      <div class="field">
        <label>Email</label>
        <input id="email" type="email" placeholder="you@company.com" autocomplete="email"/>
      </div>

      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password"/>
          <span class="eye" onclick="togglePwd()">👁</span>
        </div>
      </div>

      <button class="btn" onclick="login()">Sign in</button>

      <div class="links">
        <a href="register.html">Create account</a>
        <a href="forgot.html">Forgot password?</a>
      </div>
    </div>
  </main>
</div>

<script>
function togglePwd(){
  const p=document.getElementById('password');
  p.type=p.type==='password'?'text':'password';
}
async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const err = document.getElementById("err");
  const btn = document.querySelector(".btn");

  err.classList.remove("show");

  if(!email || !password){
    err.textContent = "Please enter your email and password.";
    err.classList.add("show");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Signing in…";

  try{
    const res = await fetch("https://pulse-marketing.onrender.com/login", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({email, password})
    });

    const data = await res.json();

    if(!res.ok){
      err.textContent = data.detail || data.message || "Invalid email or password. Please try again.";
      err.classList.add("show");
      return;
    }

    // Store user info — support both {email, name} and {user, token} shapes
    localStorage.setItem("user", data.email || email);
    localStorage.setItem("name", data.name || data.full_name || email.split("@")[0]);
    if(data.token) localStorage.setItem("token", data.token);
    if(data.access_token) localStorage.setItem("token", data.access_token);

    window.location.href = "marketing-dashboard-1.html";

  }catch(e){
    console.error(e);
    err.textContent = "Unable to reach the server. Please try again.";
    err.classList.add("show");
  } finally {
    btn.disabled = false;
    btn.textContent = "Sign in";
  }
}
document.getElementById('password').addEventListener('keydown',e=>{
  if(e.key==='Enter') login();
});
</script>
</body>
</html>
